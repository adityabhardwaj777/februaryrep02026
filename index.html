<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Will You Be My Valentine?</title>

  <style>
    body {
      height: 100vh;
      margin: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: "Arial", sans-serif;

      background-image: url("https://www.nurserymag.com/remote/aHR0cHM6Ly9naWVjZG4uYmxvYi5jb3JlLndpbmRvd3MubmV0L2ZpbGV1cGxvYWRzL2ltYWdlLzIwMjMvMDIvMTAvcm9zZS1zdG9jay13ZWIuZ2lm.PfyxNP44W5M.gif?format=webp");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    /* Dark overlay for readability */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 0;
    }

    h1 {
      color: #fff;
      font-size: 3rem;
      margin-bottom: 40px;
      text-align: center;
      text-shadow: 0 4px 20px rgba(0,0,0,0.6);
      z-index: 1;
      padding: 0 20px;
    }

    .buttons {
      position: relative;
      width: 320px;
      height: 220px;
      z-index: 1;
    }

    button {
      padding: 15px 30px;
      font-size: 1.2rem;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      position: absolute;
      box-shadow: 0 12px 25px rgba(0,0,0,0.35);
    }

    #yes {
      left: 50%;
      transform: translateX(-50%);
      bottom: 0;
      background: #ff4d6d;
      color: white;
    }

    #no {
      top: 20px;
      left: 20px;
      background: #444;
      color: white;
    }

    @media (max-width: 500px) {
      h1 {
        font-size: 2.2rem;
      }
    }
  </style>
</head>

<body>
  <h1>Will you be my Valentine? 💘</h1>

  <div class="buttons">
    <button id="no">No 😢</button>
    <button id="yes">Yes 💖</button>
  </div>

  <script>
    const noBtn = document.getElementById("no");
    const container = document.querySelector(".buttons");

    noBtn.addEventListener("mouseenter", () => {
      const maxX = container.clientWidth - noBtn.offsetWidth;
      const maxY = container.clientHeight - noBtn.offsetHeight;

      const randomX = Math.random() * maxX;
      const randomY = Math.random() * maxY;

      noBtn.style.left = randomX + "px";
      noBtn.style.top = randomY + "px";
    });

    document.getElementById("yes").addEventListener("click", () => {
      document.body.innerHTML = `
        <h1 style="color:white;text-align:center;text-shadow:0 4px 20px rgba(0,0,0,0.6);">
          YAY 💕 I knew it 😌💖
        </h1>
      `;
    });
  </script>
</body>
</html>
