<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Will You Be My Valentine?</title>

  <style>
    body {
      height: 100vh;
      margin: 0;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;

      background-image: url("https://www.nurserymag.com/remote/aHR0cHM6Ly9naWVjZG4uYmxvYi5jb3JlLndpbmRvd3MubmV0L2ZpbGV1cGxvYWRzL2ltYWdlLzIwMjMvMDIvMTAvcm9zZS1zdG9jay13ZWIuZ2lm.PfyxNP44W5M.gif?format=webp");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 0;
    }

    h1 {
      color: white;
      font-size: 3rem;
      text-align: center;
      text-shadow: 0 4px 20px rgba(0,0,0,0.6);
      margin-bottom: 20px;
      z-index: 1;
      padding: 0 20px;
    }

    p {
      color: white;
      font-size: 1.2rem;
      z-index: 1;
    }

    .screen {
      position: relative;
      z-index: 1;
      text-align: center;
    }

    /* ---------- GAME ---------- */
    #playArea {
      position: relative;
      width: 320px;
      height: 360px;
      margin: 20px auto;
      overflow: hidden;
    }

    .heart {
      position: absolute;
      font-size: 3rem;
      cursor: pointer;
      user-select: none;
      animation: floatUp 4s linear forwards;
    }

    @keyframes floatUp {
      from { transform: translateY(360px); opacity: 1; }
      to   { transform: translateY(-60px); opacity: 0; }
    }

    /* ---------- COUNTDOWN ---------- */
    #countdown {
      display: none;
    }

    .count-number {
      font-size: 10rem;
      font-weight: bold;
      color: rgba(255,255,255,0.25);
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 0;
    }

    /* ---------- QUESTION ---------- */
    .buttons {
      position: relative;
      width: 320px;
      height: 220px;
      margin: 0 auto;
    }

    button {
      padding: 15px 30px;
      font-size: 1.2rem;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      position: absolute;
      box-shadow: 0 12px 25px rgba(0,0,0,0.35);
    }

    #yes {
      left: 50%;
      transform: translateX(-50%);
      bottom: 0;
      background: #ff4d6d;
      color: white;
    }

    #no {
      top: 20px;
      left: 20px;
      background: #444;
      color: white;
    }

    @media (max-width: 500px) {
      h1 { font-size: 2.2rem; }
      .count-number { font-size: 6rem; }
    }
  </style>
</head>

<body>

  <!-- SCREEN 1: GAME -->
  <div id="game" class="screen">
    <h1>Before you continue… 💗</h1>
    <p>Catch 3 hearts to unlock the question</p>
    <div id="playArea"></div>
  </div>

  <!-- SCREEN 2: COUNTDOWN -->
  <div id="countdown" class="screen">
    <h1>ARE U READY FOR THE QUESTION 😳🌹</h1>
    <div id="countNumber" class="count-number">3</div>
  </div>

  <!-- SCREEN 3: QUESTION -->
  <div id="valentine" class="screen" style="display:none;">
    <h1>Will you be my Valentine? 💘</h1>
    <div class="buttons">
      <button id="no">No 😢</button>
      <button id="yes">Yes 💖</button>
    </div>
  </div>

  <script>
    /* ---------- GAME LOGIC ---------- */
    let score = 0;
    const playArea = document.getElementById("playArea");

    function spawnHeart() {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.textContent = "💖";
      heart.style.left = Math.random() * 260 + "px";

      heart.onclick = () => {
        score++;
        heart.remove();

        if (score >= 3) {
          endGame();
        }
      };

      playArea.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 4000);
    }

    const heartInterval = setInterval(() => {
      if (score < 3) spawnHeart();
      else clearInterval(heartInterval);
    }, 900);

    function endGame() {
      document.getElementById("game").style.display = "none";
      startCountdown();
    }

    /* ---------- COUNTDOWN LOGIC ---------- */
    function startCountdown() {
      const countdown = document.getElementById("countdown");
      const number = document.getElementById("countNumber");
      countdown.style.display = "block";

      let count = 3;
      number.textContent = count;

      const timer = setInterval(() => {
        count--;
        if (count === 0) {
          clearInterval(timer);
          countdown.style.display = "none";
          document.getElementById("valentine").style.display = "block";
        } else {
          number.textContent = count;
        }
      }, 1000);
    }

    /* ---------- RUNNING NO BUTTON ---------- */
    const noBtn = document.getElementById("no");
    const container = document.querySelector(".buttons");

    noBtn.addEventListener("mouseenter", () => {
      const maxX = container.clientWidth - noBtn.offsetWidth;
      const maxY = container.clientHeight - noBtn.offsetHeight;
      noBtn.style.left = Math.random() * maxX + "px";
      noBtn.style.top = Math.random() * maxY + "px";
    });

    document.getElementById("yes").addEventListener("click", () => {
      document.body.innerHTML = `
        <h1 style="color:white;text-align:center;text-shadow:0 4px 20px rgba(0,0,0,0.6);">
          YAY 💕 I knew it 😌💖
        </h1>
      `;
    });
  </script>

</body>
</html>
